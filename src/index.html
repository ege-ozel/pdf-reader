<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <!-- pinch-zoom is disabled at the page level so it doesn't fight the
         app's own zoom (double-tap, +/- pill, ctrl+wheel) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PDF Reader</title>
    <!-- docx-preview's UMD build reads the global JSZip, so JSZip loads first -->
    <script src="/vendor/docx-preview/jszip.min.js"></script>
    <script src="/vendor/docx-preview/docx-preview.min.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="toolbar">
      <button id="sidebar-toggle-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <button id="open-btn" class="icon-btn" title="Open a PDF or Word file" aria-label="Open a PDF or Word file">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
          <path d="M14 3v6h6" />
          <path d="M12 12v6M9 15h6" />
        </svg>
      </button>
      <div id="page-layout-seg" class="toolbar-seg" role="group" aria-label="Page layout" hidden>
        <button class="icon-btn seg-btn" data-page-layout="single" title="Single page" aria-label="Single page" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="2.5" width="14" height="8" rx="1.5" />
            <rect x="5" y="13.5" width="14" height="8" rx="1.5" />
          </svg>
        </button>
        <button class="icon-btn seg-btn" data-page-layout="dual" title="Side by side" aria-label="Side by side" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="4" width="8" height="16" rx="1.5" />
            <rect x="13.5" y="4" width="8" height="16" rx="1.5" />
          </svg>
        </button>
      </div>
      <button id="zoom-out-btn" class="icon-btn" title="Zoom out" aria-label="Zoom out" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M8 11h6" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </button>
      <button id="zoom-in-btn" class="icon-btn" title="Zoom in" aria-label="Zoom in" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M8 11h6M11 8v6" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </button>
      <button id="fit-page-btn" class="icon-btn" title="Fit and center the page" aria-label="Fit and center the page" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M3 12h18" />
          <path d="M9 6l3-3 3 3" />
          <path d="M9 18l3 3 3-3" />
          <path d="M6 9l-3 3 3 3" />
          <path d="M18 9l3 3-3 3" />
        </svg>
      </button>
      <button id="zoom-reset-btn" class="icon-btn" title="Fit width (reset zoom)" aria-label="Fit width and reset zoom" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4v16M18 4v16" />
          <path d="M9 12h6" />
          <path d="M11 9l-2 3 2 3M13 9l2 3-2 3" />
        </svg>
      </button>
      <button id="fullscreen-btn" class="icon-btn" title="Full screen" aria-label="Enter full screen" aria-pressed="false" hidden>
        <svg class="fs-enter-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9V3h6" />
          <path d="M21 9V3h-6" />
          <path d="M3 15v6h6" />
          <path d="M21 15v6h-6" />
        </svg>
        <svg class="fs-reading-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5.5C5.5 4.2 8.5 4.2 12 6c3.5-1.8 6.5-1.8 9-.5V19c-2.5-1.3-5.5-1.3-9 .5-3.5-1.8-6.5-1.8-9-.5z" />
          <path d="M12 6v13.5" />
        </svg>
        <svg class="fs-exit-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3v6H3" />
          <path d="M15 3v6h6" />
          <path d="M9 21v-6H3" />
          <path d="M15 21v-6h6" />
        </svg>
      </button>
      <button id="markup-btn" class="icon-btn" title="Mark up" aria-label="Mark up this PDF" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16z" />
          <path d="M14 7l3 3" />
        </svg>
      </button>
      <div id="page-nav" class="toolbar-nav-wrap" hidden>
        <button id="page-nav-btn" class="icon-btn page-nav-btn" title="Go to page" aria-label="Go to page" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h3" />
          </svg>
          <span id="page-nav-label">1 / 1</span>
        </button>
        <div id="page-nav-popover" role="dialog" aria-label="Go to page" hidden>
          <button id="page-prev-btn" class="icon-btn" title="Previous page" aria-label="Previous page">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
          <input id="page-nav-input" type="number" min="1" inputmode="numeric" aria-label="Page number" />
          <span id="page-nav-total">/ 1</span>
          <button id="page-next-btn" class="icon-btn" title="Next page" aria-label="Next page">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>
      <span id="app-title">PDF Reader</span>
      <div id="toolbar-menu-wrap">
        <button id="toolbar-menu-btn" class="icon-btn" title="View options" aria-label="View options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7" />
            <circle cx="12" cy="12" r="1.7" />
            <circle cx="12" cy="19" r="1.7" />
          </svg>
        </button>
        <div id="toolbar-menu" role="menu" aria-label="View options" hidden>
          <div class="toolbar-menu-heading">Scroll mode</div>
          <button class="scroll-mode-option" data-scroll-mode="continuous" role="menuitemradio" aria-checked="true" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 4h8M8 20h8" />
              <path d="M12 4v16" />
              <path d="M9 8l3-3 3 3M9 16l3 3 3-3" />
            </svg>
            <span><strong>Free scrolling</strong><small>Glide through the whole document</small></span>
            <span class="layout-option-check" aria-hidden="true">&#10003;</span>
          </button>
          <button class="scroll-mode-option" data-scroll-mode="paged" role="menuitemradio" aria-checked="false" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="6" y="3.5" width="12" height="17" rx="1.5" />
              <path d="M9 9h6M9 12h6M9 15h4" />
            </svg>
            <span><strong>One page at a time</strong><small>Fit a page, swipe or arrow to turn</small></span>
            <span class="layout-option-check" aria-hidden="true">&#10003;</span>
          </button>
          <div class="toolbar-menu-zoom">
            <div class="toolbar-menu-heading">Zoom</div>
            <button id="menu-zoom-out-btn" class="menu-zoom-btn" type="button">Zoom out</button>
            <button id="menu-zoom-reset-btn" class="menu-zoom-btn" type="button">Fit width</button>
            <button id="menu-zoom-in-btn" class="menu-zoom-btn" type="button">Zoom in</button>
          </div>
        </div>
      </div>
      <span id="status" role="alert" aria-live="assertive"></span>
      <div id="loading-indicator" hidden>
        <div class="spinner"></div>
        <span>Loading document...</span>
      </div>
    </div>
    <div id="app-shell">
      <div id="sidebar-backdrop"></div>
      <aside id="sidebar">
        <div class="sidebar-section">
          <h3 class="sidebar-heading">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5" />
              <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z" />
            </svg>
            Starred
          </h3>
          <div id="sidebar-pinned"></div>
        </div>
        <div class="sidebar-section">
          <h3 class="sidebar-heading">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg>
            Recent
          </h3>
          <div id="sidebar-recent"></div>
          <p id="sidebar-recent-note" class="sidebar-note" hidden></p>
        </div>
      </aside>
      <div id="main-area">
        <div id="empty-state">
          <div id="empty-state-icon">
            <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <path d="M12 6h16l8 8v28a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
              <path d="M28 6v8h8" />
              <path d="M16 26h16M16 32h11" stroke-width="1.5" />
            </svg>
          </div>
          <p id="empty-state-text">Drop a PDF or Word file here or click to open</p>
        </div>
        <div id="viewer-container" hidden><div id="pdf-pages"></div></div>
        <div id="docx-container" hidden><div id="docx-pages"></div></div>
      </div>
    </div>
    <!-- Mark-up tools (PDF only). Floating: under the toolbar on wide
         screens, at the bottom on phones so thumbs reach it. -->
    <div id="markup-bar" hidden>
      <div class="markup-row" role="toolbar" aria-label="Mark-up tools">
        <button class="icon-btn" data-tool="highlight" title="Highlight text (select it)" aria-label="Highlight text" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 4l5 5-8 8H7v-5z" />
            <path d="M7 17l-3 3h6" />
          </svg>
        </button>
        <button class="icon-btn" data-tool="ink" title="Draw" aria-label="Draw" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 17c3-6 5-6 6-3s3 3 6-3 4-2 6 0" />
          </svg>
        </button>
        <button class="icon-btn" data-tool="note" title="Add a note (tap a note to open it)" aria-label="Add a text note" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 4h14v12H9l-4 4z" />
            <path d="M9 9h6M9 12h4" />
          </svg>
        </button>
        <button class="icon-btn" data-tool="eraser" title="Erase marks" aria-label="Erase marks" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 20h12" />
            <path d="M4.5 14.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18H8z" />
            <path d="M9 10l5 5" />
          </svg>
        </button>
        <span class="markup-sep" aria-hidden="true"></span>
        <button id="markup-color-btn" class="icon-btn" title="Colour" aria-label="Choose colour" aria-haspopup="menu" aria-expanded="false">
          <span class="markup-color-dot" aria-hidden="true"></span>
        </button>
        <span class="markup-sep" aria-hidden="true"></span>
        <button id="markup-undo-btn" class="icon-btn" title="Undo" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14L4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
        </button>
        <button id="markup-redo-btn" class="icon-btn" title="Redo" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 14l5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
        </button>
        <button id="markup-save-btn" class="icon-btn" title="Save marks" aria-label="Save marks" aria-haspopup="menu" aria-expanded="false" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 4h11l3 3v13H5z" />
            <path d="M8 4v5h7V4" />
            <path d="M8 20v-6h8v6" />
          </svg>
        </button>
      </div>
      <div id="markup-color-menu" class="markup-menu" role="menu" aria-label="Colour" hidden>
        <button class="markup-swatch" data-color="#ffd43b" style="--swatch: #ffd43b" role="menuitemradio" aria-label="Yellow" aria-pressed="true"></button>
        <button class="markup-swatch" data-color="#69db7c" style="--swatch: #69db7c" role="menuitemradio" aria-label="Green" aria-pressed="false"></button>
        <button class="markup-swatch" data-color="#4dabf7" style="--swatch: #4dabf7" role="menuitemradio" aria-label="Blue" aria-pressed="false"></button>
        <button class="markup-swatch" data-color="#ff6b6b" style="--swatch: #ff6b6b" role="menuitemradio" aria-label="Red" aria-pressed="false"></button>
        <button class="markup-swatch" data-color="#212529" style="--swatch: #212529" role="menuitemradio" aria-label="Black" aria-pressed="false"></button>
      </div>
      <div id="markup-save-menu" class="markup-menu" role="menu" aria-label="Save marks" hidden>
        <button type="button" data-save-mode="copy" role="menuitem">Save as copy</button>
        <button type="button" data-save-mode="overwrite" role="menuitem">Overwrite original</button>
      </div>
    </div>
  </body>
</html>
